<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #0d1117;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    color: #e6edf3;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* faint radial wash behind the fan */
  body::before {
    content: "";
    position: absolute;
    width: 900px; height: 900px;
    right: -220px; top: 50%;
    transform: translateY(-50%);
    background: radial-gradient(circle, rgba(88,166,255,0.09) 0%, rgba(13,17,23,0) 62%);
  }

  .wrap {
    width: 1280px; height: 640px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 0 84px;
    position: relative;
    z-index: 1;
  }

  .title {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1;
    color: #f0f6fc;
  }
  .rule {
    width: 76px; height: 4px;
    background: #58a6ff;
    border-radius: 2px;
    margin: 30px 0;
  }
  .tagline {
    font-size: 27px;
    line-height: 1.42;
    color: #8b949e;
    max-width: 460px;
    font-weight: 400;
  }
  .tagline b { color: #e6edf3; font-weight: 600; }
  .meta {
    margin-top: 38px;
    font-size: 17px;
    color: #6e7681;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    letter-spacing: -0.01em;
  }

  /* the fan */
  .fan {
    position: relative;
    height: 640px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 10px;
  }
  .fan-inner { position: relative; width: 420px; height: 420px; }

  .hub {
    position: absolute;
    left: 0; top: 50%;
    transform: translateY(-50%);
    width: 13px; height: 13px;
    border-radius: 50%;
    background: #58a6ff;
    box-shadow: 0 0 0 7px rgba(88,166,255,0.14);
  }

  .spoke {
    position: absolute;
    left: 6px; top: 50%;
    transform-origin: 0 50%;
    display: flex;
    align-items: center;
    gap: 14px;
    white-space: nowrap;
  }
  .line {
    width: 118px; height: 1.5px;
    background: linear-gradient(90deg, rgba(88,166,255,0.55), rgba(88,166,255,0.13));
    border-radius: 1px;
  }
  .name {
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
    font-size: 19px;
    color: #c9d1d9;
    letter-spacing: -0.015em;
  }
  /* counter-rotate the label so text stays level */
  .spoke .name { display: inline-block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="left">
      <div class="title">lateral&#8209;thinking</div>
      <div class="rule"></div>
      <div class="tagline">Your AI agent's ideas are&nbsp;predictable.<br><b>These skills fix that.</b></div>
      <div class="meta">8 techniques + a router &nbsp;·&nbsp; MIT</div>
    </div>

    <div class="fan">
      <div class="fan-inner" id="fan">
        <div class="hub"></div>
      </div>
    </div>
  </div>

<script>
  const names = [
    "random-stimulus",
    "provocation",
    "inversion",
    "concept-fan",
    "analogy",
    "scamper",
    "six-hats",
    "worst-idea"
  ];
  const fan = document.getElementById("fan");
  const spread = 116;                     // total degrees of the fan
  const start  = -spread / 2;
  const step   = spread / (names.length - 1);

  names.forEach((n, i) => {
    const angle = start + step * i;
    const el = document.createElement("div");
    el.className = "spoke";
    el.style.transform = `rotate(${angle}deg)`;
    el.innerHTML =
      `<div class="line"></div>` +
      `<div class="name" style="transform: rotate(${-angle}deg)">${n}</div>`;
    fan.appendChild(el);
  });
</script>
</body>
</html>
